name: cadence_music
description: "An independently developed local-first desktop music app."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite_common_ffi: ^2.3.6+1
  file_picker: ^10.3.2
  desktop_drop: ^0.5.0
  dynamic_color: ^1.7.0
  haudiotagger: ^2.2.0
  media_kit: ^1.2.0
  media_kit_libs_audio: ^1.0.7
  http: ^1.4.0
  url_launcher: ^6.3.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
